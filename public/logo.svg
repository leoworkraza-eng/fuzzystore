<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fuzzy Store logo: a fuzzy round shop buddy under an awning -->
  <defs>
    <linearGradient id="fz-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4b95f"/>
      <stop offset="1" stop-color="#e0623f"/>
    </linearGradient>
    <linearGradient id="fz-awning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3e2"/>
      <stop offset="1" stop-color="#ffd9a8"/>
    </linearGradient>
  </defs>

  <!-- awning -->
  <path d="M8 14a24 10 0 0 1 48 0v6H8z" fill="url(#fz-awning)"/>
  <path d="M8 20h48v3H8z" fill="#e0623f" opacity=".35"/>
  <g fill="#e0623f" opacity=".55">
    <path d="M14 14l3 6h-6z"/>
    <path d="M24 14l3 6h-6z"/>
    <path d="M34 14l3 6h-6z"/>
    <path d="M44 14l3 6h-6z"/>
  </g>

  <!-- fuzzy body -->
  <circle cx="32" cy="38" r="18" fill="url(#fz-body)"/>
  <g fill="#fff" opacity=".22">
    <circle cx="22" cy="30" r="2.4"/>
    <circle cx="43" cy="33" r="1.8"/>
    <circle cx="36" cy="52" r="2.2"/>
    <circle cx="20" cy="45" r="1.6"/>
  </g>

  <!-- eyes + smile -->
  <circle cx="26" cy="36" r="2.6" fill="#22151b"/>
  <circle cx="38" cy="36" r="2.6" fill="#22151b"/>
  <circle cx="26.9" cy="35.1" r="0.9" fill="#fff"/>
  <circle cx="38.9" cy="35.1" r="0.9" fill="#fff"/>
  <path d="M27 43q5 4 10 0" stroke="#22151b" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="20.5" cy="41" rx="2.6" ry="1.6" fill="#fff" opacity=".35"/>
  <ellipse cx="43.5" cy="41" rx="2.6" ry="1.6" fill="#fff" opacity=".35"/>
</svg>
